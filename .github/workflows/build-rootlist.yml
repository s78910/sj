name: Build RootList APK

on:
  push:
    branches: [ superroot ]
  pull_request:
    branches: [ superroot ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Clean conflicting resources
      run: |
        find app/src/main/res/mipmap-* -type f \( -name "*.png" -o -name "*.webp" -o -name "*.xml" \) -delete 2>/dev/null || true
        echo "=== Project structure ==="
        find . -name "*.kt" -o -name "*.xml" | head -50
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --stacktrace 2>&1 || {
          echo "=== Build failed, showing error details ==="
          cat app/build/outputs/logs/*.log 2>/dev/null || true
          exit 1
        }
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: rootlist-release
        path: app/build/outputs/apk/release/*.apk
